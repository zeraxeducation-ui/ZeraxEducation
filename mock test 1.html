<html lang="en">

  <title>Zerax | Mock Test</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1220;--panel:#111c2d;--panel2:#172439;--line:#2a3a51;--text:#f2f6fc;--muted:#a8b6c9;--blue:#55a7ff;--green:#38cf91;--red:#ff6878;--purple:#bd91ff;--amber:#ffca6b;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);min-height:100dvh}button,input{font:inherit}button{cursor:pointer;color:inherit}.hidden{display:none!important}.app{min-height:100dvh;display:flex;flex-direction:column}.top{position:sticky;top:0;z-index:5;background:#101827;border-bottom:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-left));display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:12px;min-width:0}.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#2087f6,#7357e8);display:grid;place-items:center;font-weight:900}.brand h1{font-size:16px;margin:0;letter-spacing:.04em}.brand p{font-size:12px;margin:2px 0 0;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top-actions{display:flex;align-items:center;gap:8px}.timer{font:700 19px ui-monospace,monospace;background:#080e18;border:1px solid var(--line);padding:7px 12px;border-radius:10px;min-width:104px;text-align:center}.timer.warn{color:var(--red);border-color:var(--red)}.btn{border:1px solid var(--line);background:var(--panel2);padding:9px 13px;border-radius:9px;font-weight:650}.btn:hover{filter:brightness(1.13)}.btn.primary{background:#1673dc;border-color:#1673dc}.btn.success{background:#087c57;border-color:#087c57}.btn.danger{background:#9d2938;border-color:#9d2938}.btn.ghost{background:transparent}.main{width:min(1500px,100%);margin:auto;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;flex:1}.work,.side{background:var(--panel);border:1px solid var(--line);border-radius:14px;min-width:0}.work{display:flex;flex-direction:column;min-height:calc(100dvh - 100px)}.work-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.tabs{display:flex;gap:8px;overflow:auto}.tab{white-space:nowrap}.tab.active{background:#155eaa;border-color:#338eed}.marking{font-size:13px;color:var(--muted);white-space:nowrap}.question{padding:clamp(18px,4vw,36px);flex:1}.qmeta{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);font-size:13px;margin-bottom:18px}.qtext{font-size:clamp(18px,2vw,22px);line-height:1.65;margin:0 0 26px;white-space:pre-wrap}.options{display:grid;gap:12px;max-width:900px}.option{display:flex;align-items:flex-start;gap:13px;padding:15px;border:1px solid var(--line);border-radius:12px;background:#0e1828;text-align:left;width:100%}.option:hover{border-color:#5489bd}.option.selected{border-color:var(--blue);background:#102d4a;box-shadow:0 0 0 1px var(--blue)}.letter{width:28px;height:28px;flex:none;border-radius:50%;display:grid;place-items:center;background:#24344a;font-weight:700}.option.selected .letter{background:#1673dc}.numeric{display:flex;gap:10px;max-width:480px}.numeric input{min-width:0;flex:1;padding:12px 14px;background:#080e18;color:var(--text);border:1px solid var(--line);border-radius:10px;font-size:20px}.hint{font-size:13px;color:var(--muted);margin:9px 0}.actions{border-top:1px solid var(--line);padding:14px 18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.spacer{flex:1}.side{display:flex;flex-direction:column;max-height:calc(100dvh - 110px);position:sticky;top:82px}.side h2{font-size:15px;margin:0;padding:15px 16px;border-bottom:1px solid var(--line)}.legend{padding:12px 15px;display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}.legend span{display:flex;align-items:center;gap:7px}.dot{width:13px;height:13px;border-radius:4px;background:#526178;display:inline-block}.dot.answered{background:var(--green)}.dot.review{background:var(--purple)}.dot.both{background:linear-gradient(135deg,var(--green) 50%,var(--purple) 50%)}.dot.unanswered{background:var(--red)}.grid{padding:14px;overflow:auto;display:grid;grid-template-columns:repeat(5,minmax(36px,1fr));gap:8px;align-content:start}.qbtn{aspect-ratio:1;border:1px solid #45546a;background:#253247;border-radius:8px;color:white;font-weight:700}.qbtn.answered{background:#087c57;border-color:var(--green)}.qbtn.unanswered{background:#922c3a;border-color:var(--red)}.qbtn.review{background:#7045a6;border-color:var(--purple)}.qbtn.both{background:linear-gradient(135deg,#087c57 50%,#7045a6 50%);border-color:var(--purple)}.qbtn.current{outline:3px solid var(--blue);outline-offset:1px}.side-foot{padding:12px;border-top:1px solid var(--line)}.summary{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:10px}.overlay{position:fixed;inset:0;z-index:20;background:#050a12dd;display:grid;place-items:center;padding:16px;overflow:auto}.dialog{width:min(560px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;max-height:90dvh;overflow:auto;box-shadow:0 20px 80px #0009}.dialog h2{margin:0 0 8px}.dialog p,.dialog li{color:var(--muted)}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.result{width:min(1050px,100%)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.metric{background:#0c1523;border:1px solid var(--line);padding:15px;border-radius:12px}.metric small{display:block;color:var(--muted)}.metric strong{display:block;font-size:25px;margin-top:4px}.review-list{display:grid;gap:10px;margin-top:20px}.review-card{padding:15px;background:#0c1523;border:1px solid var(--line);border-radius:12px}.review-card h3{font-size:15px;margin:0 0 8px}.review-card p{margin:7px 0}.pill{display:inline-block;border:1px solid var(--line);padding:3px 8px;border-radius:99px;color:var(--muted);font-size:12px}.notice{font-size:12px;color:var(--muted);padding:10px 14px;border-top:1px solid var(--line)}:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
    @media(max-width:900px){.main{grid-template-columns:1fr}.work{min-height:60dvh}.side{position:static;max-height:45dvh}.grid{grid-template-columns:repeat(8,minmax(32px,1fr))}.top{flex-wrap:wrap}.brand{flex:1}.top-actions{margin-left:auto}}
    @media(max-width:560px){.top{padding:9px 12px}.brand h1{font-size:14px}.brand p{max-width:52vw}.logo{width:34px;height:34px}.top-actions{gap:5px}.top-actions .btn{padding:7px 9px;font-size:13px}.timer{font-size:16px;min-width:88px;padding:6px 8px}.main{padding:9px;gap:9px}.work{min-height:58dvh}.work-head{padding:10px;align-items:flex-start;flex-direction:column}.tabs{width:100%}.question{padding:17px 13px}.actions{padding:10px;gap:6px}.actions .btn{padding:8px 10px;font-size:13px}.grid{grid-template-columns:repeat(6,minmax(32px,1fr));gap:6px}.metrics{grid-template-columns:repeat(2,1fr)}.dialog{padding:17px}.numeric{flex-wrap:wrap}.numeric input{flex-basis:100%}}
  </style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand"><div class="logo" aria-hidden="true">Z</div><div><h1>ZERAX MOCK TEST</h1><p id="examTitle">Practice mode · sample questions</p></div></div>
    <div class="top-actions"><div id="timer" class="timer" role="timer" aria-live="off">00:00</div><button id="changeExam" class="btn ghost">Change test</button><button id="submitTop" class="btn success">Submit</button></div>
  </header>
  <main class="main" id="testScreen">
    <section class="work" aria-label="Test question">
      <div class="work-head"><div class="tabs" id="sectionTabs" role="tablist" aria-label="Subjects"></div><div class="marking" id="marking"></div></div>
      <div class="question"><div class="qmeta"><strong id="questionNumber"></strong><span id="questionType" class="pill"></span></div><h2 class="qtext" id="questionText"></h2><div class="options" id="answerArea"></div><p class="hint" id="answerHint"></p></div>
      <div class="actions"><button class="btn" id="clearAnswer">Clear answer</button><button class="btn" id="markReview">Mark for review</button><button class="btn" id="previous">← Previous</button><span class="spacer"></span><button class="btn primary" id="next">Save &amp; next →</button></div>
    </section>
    <aside class="side" aria-label="Question palette"><h2 id="paletteTitle">Questions</h2><div class="legend"><span><i class="dot"></i>Not visited</span><span><i class="dot unanswered"></i>Visited, blank</span><span><i class="dot answered"></i>Answered</span><span><i class="dot review"></i>Review</span><span><i class="dot both"></i>Answered + review</span></div><div class="grid" id="palette"></div><div class="side-foot"><div class="summary" id="counts"></div><button id="submitSide" class="btn success" style="width:100%">Review &amp; submit</button></div></aside>
  </main>
  <div class="notice">Practice prototype. Questions and answer key are included in this file; do not use it for secure or official scored exams.</div>
</div>
<div id="modalRoot"></div>
<script>
/* Sample-only data. Replace with reviewed, versioned exam content before publication. */
const TESTS={
  jee:{name:'JEE Main · sample set',duration:30*60,sections:[
    {name:'Physics',questions:[{id:'jp1',type:'single',text:'A particle has velocity v(t) = 3t² − 6t m/s for 0 ≤ t ≤ 3 s. What total distance does it travel?',options:['8 m','11 m','15 m','27 m'],answer:0,explanation:'The velocity changes sign at t = 2. The distance from 0 to 2 s is 4 m; from 2 to 3 s it is 4 m. Total distance = 8 m.',marks:4,penalty:1}]},
    {name:'Chemistry',questions:[{id:'jc1',type:'single',text:'Which of the following is the conjugate base of H₂CO₃ after loss of one proton?',options:['CO₃²⁻','HCO₃⁻','H₃CO₃⁺','OH⁻'],answer:1,explanation:'Loss of one proton from H₂CO₃ produces HCO₃⁻.',marks:4,penalty:1}]},
    {name:'Mathematics',questions:[{id:'jm1',type:'numeric',text:'How many distinct real roots does (x − 2)² = 0 have?',answer:1,tolerance:0,explanation:'There is one distinct root, x = 2.',marks:4,penalty:1}]}
  ]},
  neet:{name:'NEET UG · sample set',duration:30*60,sections:[
    {name:'Botany',questions:[{id:'nb1',type:'single',text:'Which plant hormone is primarily associated with apical dominance?',options:['Auxin','Gibberellin','Cytokinin','Abscisic acid'],answer:0,explanation:'Auxin from the shoot apex suppresses the growth of lateral buds.',marks:4,penalty:1}]},
    {name:'Zoology',questions:[{id:'nz1',type:'single',text:'Which chamber pumps oxygenated blood into the aorta?',options:['Left ventricle','Right ventricle','Left atrium','Right atrium'],answer:0,explanation:'The left ventricle pumps oxygenated blood through the aortic valve.',marks:4,penalty:1}]}
  ]},
  advanced:{name:'JEE Advanced · sample set',duration:30*60,sections:[
    {name:'Physics',questions:[{id:'ap1',type:'multi',text:'Select all true statements about electromagnetic waves in vacuum.',options:['Electric and magnetic fields are mutually perpendicular.','They are longitudinal waves.','Their speed in vacuum is independent of frequency.','Electric and magnetic field energy densities are equal.'],answer:[0,2,3],explanation:'In vacuum, electromagnetic waves are transverse, travel at c independent of frequency, and have equal electric and magnetic energy densities.',marks:4,penalty:0}]},
    {name:'Chemistry',questions:[{id:'ac1',type:'numeric',text:'Enter the number of distinct real roots of x² − 4x + 4 = 0.',answer:1,tolerance:0,explanation:'(x − 2)² = 0 has one distinct real root.',marks:4,penalty:0}]},
    {name:'Mathematics',questions:[{id:'am1',type:'single',text:'If f(x) = x², what is f′(3)?',options:['3','6','9','12'],answer:1,explanation:'f′(x) = 2x, so f′(3) = 6.',marks:4,penalty:1}]}
  ]}
};
const $=s=>document.querySelector(s);let testKey='jee',exam,sectionIndex=0,questionIndex=0,answers={},deadline=0,timerId=null,finished=false;
function allQuestions(){return exam.sections.flatMap((s,si)=>s.questions.map((q,qi)=>({q,si,qi})))}
function current(){return exam.sections[sectionIndex].questions[questionIndex]}
function state(q){return answers[q.id]}
function attempted(q){let a=state(q);return q.type==='numeric'?a.value.trim()!=='' : q.type==='multi'?a.selected.length>0:a.selected!==null}
function status(q){const a=state(q),has=attempted(q);return has?(a.review?'both':'answered'):(a.review?'review':a.visited?'unanswered':'')}
function start(key=testKey){if(timerId)clearInterval(timerId);testKey=key;exam=TESTS[key];sectionIndex=0;questionIndex=0;finished=false;answers={};for(const {q} of allQuestions())answers[q.id]={visited:false,selected:null,value:'',review:false};deadline=Date.now()+exam.duration*1000;$('#examTitle').textContent=exam.name+' · sample questions';$('#testScreen').classList.remove('hidden');tick();timerId=setInterval(tick,500);render()}
function renderTabs(){let root=$('#sectionTabs');root.replaceChildren();exam.sections.forEach((s,i)=>{let b=document.createElement('button');b.className='btn tab '+(i===sectionIndex?'active':'');b.setAttribute('role','tab');b.setAttribute('aria-selected',i===sectionIndex);b.textContent=s.name;b.onclick=()=>{sectionIndex=i;questionIndex=0;render()};root.append(b)});let sec=exam.sections[sectionIndex];$('#marking').textContent=`+${sec.questions[0]?.marks??4} / −${sec.questions[0]?.penalty??0} (sample rule)`}
function render(){if(finished)return;let q=current(),a=state(q);a.visited=true;renderTabs();$('#questionNumber').textContent=`${exam.sections[sectionIndex].name} · Question ${questionIndex+1} of ${exam.sections[sectionIndex].questions.length}`;$('#questionType').textContent=q.type==='multi'?'Select all that apply':q.type==='numeric'?'Numerical answer':'Single choice';$('#questionText').textContent=q.text;$('#answerHint').textContent=q.type==='multi'?'Choose every correct option.':q.type==='numeric'?'Enter a number. Use the keyboard or keypad on your device.':'';let area=$('#answerArea');area.replaceChildren();if(q.type==='numeric'){let wrap=document.createElement('div');wrap.className='numeric';let input=document.createElement('input');input.type='number';input.inputMode='decimal';input.step='any';input.setAttribute('aria-label','Numerical answer');input.value=a.value;input.oninput=()=>{a.value=input.value;renderPalette()};wrap.append(input);area.append(wrap);input.focus({preventScroll:true})}else q.options.forEach((label,i)=>{let b=document.createElement('button');let selected=q.type==='multi'?a.selected.includes(i):a.selected===i;b.type='button';b.className='option'+(selected?' selected':'');b.setAttribute('aria-pressed',selected);let letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+i);let text=document.createElement('span');text.textContent=label;b.append(letter,text);b.onclick=()=>{if(q.type==='multi'){a.selected=selected?a.selected.filter(x=>x!==i):[...a.selected,i]}else a.selected=i;render()};area.append(b)});$('#markReview').textContent=a.review?'Remove review mark':'Mark for review';$('#previous').disabled=sectionIndex===0&&questionIndex===0;renderPalette();renderCounts()}
function renderPalette(){let root=$('#palette');root.replaceChildren();exam.sections[sectionIndex].questions.forEach((q,i)=>{let b=document.createElement('button');b.className='qbtn '+status(q)+(i===questionIndex?' current':'');b.textContent=i+1;b.setAttribute('aria-label',`Question ${i+1}${status(q)?', '+status(q):', not visited'}${i===questionIndex?', current':''}`);b.onclick=()=>{questionIndex=i;render()};root.append(b)});$('#paletteTitle').textContent=exam.sections[sectionIndex].name+' questions'}
function renderCounts(){let qs=allQuestions().map(x=>x.q);$('#counts').textContent=`${qs.filter(q=>attempted(q)).length} answered · ${qs.filter(q=>!attempted(q)).length} blank`}
function go(step){let sec=exam.sections[sectionIndex];if(step<0){if(questionIndex>0)questionIndex--;else if(sectionIndex>0){sectionIndex--;questionIndex=exam.sections[sectionIndex].questions.length-1}}else if(questionIndex<sec.questions.length-1)questionIndex++;else if(sectionIndex<exam.sections.length-1){sectionIndex++;questionIndex=0}render()}
function tick(){let left=Math.max(0,Math.ceil((deadline-Date.now())/1000));$('#timer').textContent=`${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`;$('#timer').classList.toggle('warn',left<=300);if(left===0&&!finished){clearInterval(timerId);showSubmit(true)}}
function dialog(title,body,buttons){let root=$('#modalRoot');root.replaceChildren();let overlay=document.createElement('div');overlay.className='overlay';let d=document.createElement('section');d.className='dialog';d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');d.setAttribute('aria-labelledby','dialogTitle');let h=document.createElement('h2');h.id='dialogTitle';h.textContent=title;let content=document.createElement('div');content.innerHTML=body;let actions=document.createElement('div');actions.className='dialog-actions';d.append(h,content,actions);buttons.forEach(({label,cls,fn})=>{let b=document.createElement('button');b.className='btn '+(cls||'');b.textContent=label;b.onclick=()=>{root.replaceChildren();fn()};actions.append(b)});overlay.append(d);root.append(overlay);d.querySelector('button')?.focus()}
function showSubmit(auto=false){let qs=allQuestions().map(x=>x.q),answered=qs.filter(attempted).length,blank=qs.length-answered;dialog(auto?'Time is up':'Review before submitting',`<p>${auto?'Your time has ended. The attempt will now be submitted.':'Check your attempt summary before final submission.'}</p><p><strong>${answered}</strong> answered · <strong>${blank}</strong> blank · <strong>${qs.filter(q=>state(q).review).length}</strong> marked for review</p>${auto?'<p>Answers currently on screen are included.</p>':''}`,auto?[{label:'View results',cls:'success',fn:finish}]:[{label:'Continue test',fn:()=>{}},{label:'Submit test',cls:'success',fn:finish}])}
function isCorrect(q){let a=state(q);if(q.type==='numeric'){if(a.value.trim()==='')return false;let n=Number(a.value);return Number.isFinite(n)&&Math.abs(n-q.answer)<=(q.tolerance||0)}if(q.type==='multi')return a.selected.length===q.answer.length&&a.selected.every(x=>q.answer.includes(x));return a.selected===q.answer}
function finish(){finished=true;if(timerId)clearInterval(timerId);$('#testScreen').classList.add('hidden');let qs=allQuestions().map(({q})=>q),correct=0,wrong=0,score=0,max=0;for(const q of qs){max+=q.marks??4;if(attempted(q)){if(isCorrect(q)){correct++;score+=q.marks??4}else{wrong++;score-=q.penalty??0}}}let root=document.createElement('section');root.className='overlay';root.id='resultOverlay';let box=document.createElement('div');box.className='dialog result';box.innerHTML=`<h2>Test results</h2><p>${escapeHtml(exam.name)} · sample result</p><div class="metrics"><div class="metric"><small>Score</small><strong>${score} / ${max}</strong></div><div class="metric"><small>Correct</small><strong>${correct}</strong></div><div class="metric"><small>Incorrect</small><strong>${wrong}</strong></div><div class="metric"><small>Attempted</small><strong>${qs.filter(attempted).length} / ${qs.length}</strong></div></div><p class="pill">No percentile shown: this sample has no comparison cohort.</p><h2 style="margin-top:22px">Answer review</h2><div class="review-list" id="reviewList"></div><div class="dialog-actions"><button class="btn primary" id="retake">Retake this sample</button></div>`;root.append(box);document.body.append(root);let list=box.querySelector('#reviewList');for(const q of qs){let card=document.createElement('article');card.className='review-card';let label=attempted(q)?(isCorrect(q)?'Correct':'Incorrect'):'Unattempted';let correctAnswer=q.type==='multi'?q.answer.map(i=>q.options[i]).join('; '):q.type==='single'?q.options[q.answer]:q.answer;let yours=q.type==='multi'?state(q).selected.map(i=>q.options[i]).join('; '):q.type==='single'?(state(q).selected===null?'No answer':q.options[state(q).selected]):(state(q).value||'No answer');card.innerHTML=`<h3>${escapeHtml(exam.sections.find(s=>s.questions.includes(q)).name)} · ${escapeHtml(label)}</h3><p>${escapeHtml(q.text)}</p><p><strong>Your answer:</strong> ${escapeHtml(String(yours))}</p><p><strong>Answer:</strong> ${escapeHtml(String(correctAnswer))}</p><p>${escapeHtml(q.explanation||'')}</p>`;list.append(card)}box.querySelector('#retake').onclick=()=>start(testKey)}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('#next').onclick=()=>go(1);$('#previous').onclick=()=>go(-1);$('#clearAnswer').onclick=()=>{let a=state(current());a.selected=null;a.value='';render()};$('#markReview').onclick=()=>{state(current()).review=!state(current()).review;render()};$('#submitTop').onclick=()=>showSubmit();$('#submitSide').onclick=()=>showSubmit();$('#changeExam').onclick=()=>dialog('Change practice test','<p>Changing the sample test resets this attempt. Continue?</p>',[{label:'Keep this attempt',fn:()=>{}},{label:'Choose JEE Main',fn:()=>start('jee')},{label:'Choose NEET UG',fn:()=>start('neet')},{label:'Choose JEE Advanced',fn:()=>start('advanced') }]);
document.addEventListener('keydown',e=>{if(finished)return;if(e.key==='ArrowRight'&&e.altKey)go(1);if(e.key==='ArrowLeft'&&e.altKey)go(-1);if(e.key==='Escape'&&$('#modalRoot').firstChild)$('#modalRoot').replaceChildren()});
start();
</script>
</body>
</html>
